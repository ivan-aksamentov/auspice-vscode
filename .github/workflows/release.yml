name: "Release"

# Pushing a version tag builds the extension and, if a VSIX is produced,
# publishes it to GitHub Releases and the VS Code Marketplace. The notes of
# the GitHub release are the CHANGELOG.md section of the version, and a tag
# without one publishes nothing.
# Cut a release locally with "bun run release <patch|minor|major>", then
# "git push --follow-tags". No lint, format, or test gates run here.
on:
  push:
    tags: ["v*"]

permissions:
  contents: "write"

jobs:
  release:
    name: "Build and release"
    runs-on: "ubuntu-latest"
    steps:
      - name: "Checkout"
        uses: "actions/checkout@v7"

      - name: "Install Bun"
        run: "npm install --global bun@1.3.14"

      - name: "Install dependencies"
        run: "bun install --frozen-lockfile"

      - name: "Extract release notes from the changelog"
        run: 'bun run release:notes "${GITHUB_REF_NAME#v}" > release-notes.md'

      - name: "Build and package VSIX"
        run: "bun run package"

      - name: "Publish GitHub release"
        env:
          GH_TOKEN: "${{ github.token }}"
        run: >-
          gh release create "${GITHUB_REF_NAME}" auspice-vscode.vsix
          --title "${GITHUB_REF_NAME}"
          --notes-file release-notes.md
          --generate-notes

      - name: "Publish to VS Code Marketplace"
        env:
          VSCE_PAT: "${{ secrets.VSCE_PAT }}"
        run: "bunx vsce publish --packagePath auspice-vscode.vsix"
